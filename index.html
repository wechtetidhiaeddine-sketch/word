<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 World Country Finder</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
    url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5ce?q=80&w=1600&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:850px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:35px;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.title{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
}

.desc{
    text-align:center;
    color:#ddd;
    margin-bottom:30px;
}

.search-box{
    position:relative;
    margin-bottom:30px;
}

.search{
    width:100%;
    padding:18px 22px;
    border:none;
    outline:none;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:18px;
}

.search::placeholder{
    color:#ddd;
}

.result{
    display:none;
    background:rgba(255,255,255,0.08);
    border-radius:25px;
    padding:30px;
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.flag{
    width:130px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.country-name{
    font-size:38px;
    font-weight:700;
    margin-bottom:15px;
}

.info{
    font-size:20px;
    line-height:2;
}

.label{
    color:#00ffbf;
    font-weight:bold;
}

.map{
    width:100%;
    max-width:500px;
    border-radius:20px;
    margin-top:25px;
    border:2px solid rgba(255,255,255,0.2);
}

.error{
    text-align:center;
    font-size:25px;
    color:#ff7b7b;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#ddd;
    font-size:14px;
}

</style>
</head>
<body>

<div class="container">

    <div class="title">🌍 World Country Finder</div>

    <div class="desc">
        Search any country to get:
        international code • postal code • flag • map
    </div>

    <div class="search-box">
        <input 
        type="text" 
        id="searchInput"
        class="search"
        placeholder="Search code word...">
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const result = document.getElementById("result");
const input = document.getElementById("searchInput");

input.addEventListener("input", async () => {

    const country = input.value.trim();

    if(country === ""){
        result.style.display = "none";
        return;
    }

    try{

        const response = await fetch(
            `https://restcountries.com/v3.1/name/${country}`
        );

        const data = await response.json();

        if(data.status === 404){
            result.style.display = "block";

            result.innerHTML = `
                <div class="error">
                    ❌ Country not found
                </div>
            `;
            return;
        }

        const c = data[0];

        const name = c.name.common;
        const flag = c.flags.png;
        const code = c.idd.root 
            ? c.idd.root + (c.idd.suffixes ? c.idd.suffixes[0] : "")
            : "Unknown";

        const map = c.maps.googleMaps;

        let postal = "No postal code available";

        // بعض الأمثلة
        const postalCodes = {
            Tunisia:"1000 Tunis • 4000 Sousse • 3000 Sfax",
            France:"75000 Paris • 13000 Marseille",
            Algeria:"16000 Alger • 31000 Oran",
            Morocco:"10000 Rabat • 20000 Casablanca",
            Egypt:"11511 Cairo • 21500 Alexandria",
            Germany:"10115 Berlin • 20095 Hamburg",
            Italy:"00100 Rome • 20100 Milan",
            Spain:"28001 Madrid • 08001 Barcelona",
            Japan:"100-0001 Tokyo • 530-0001 Osaka",
            Turkey:"34000 Istanbul • 06000 Ankara",
            Canada:"M5H Toronto • H1A Montreal",
            "United States":"10001 New York • 90001 Los Angeles"
        };

        if(postalCodes[name]){
            postal = postalCodes[name];
        }

        result.style.display = "block";

        result.innerHTML = `

            <center>
                <img src="${flag}" class="flag">
            </center>

            <div class="country-name">
                ${name}
            </div>

            <div class="info">

                <span class="label">
                    🌐 International Code:
                </span>
                ${code}

                <br>

                <span class="label">
                    📮 Postal Codes:
                </span>
                ${postal}

            </div>

            <center>
                <img 
                src="https://maps.googleapis.com/maps/api/staticmap?center=${name}&zoom=4&size=600x300&maptype=roadmap&markers=color:red%7C${name}"
                class="map">
            </center>

            <br>

            <center>
                <a href="${map}" target="_blank"
                style="
                color:white;
                text-decoration:none;
                background:#00c896;
                padding:12px 25px;
                border-radius:12px;
                display:inline-block;
                font-weight:bold;
                ">
                🌍 Open Map
                </a>
            </center>

        `;

    } catch(error){

        result.style.display = "block";

        result.innerHTML = `
            <div class="error">
                ⚠️ Error loading data
            </div>
        `;
    }

});

</script>

</body>
</html>
